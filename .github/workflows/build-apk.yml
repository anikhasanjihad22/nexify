name: Build Nexify APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android tools
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: Install needed tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Build APKs
        run: |
          set -o pipefail
          ./gradlew --no-daemon --no-configuration-cache --stacktrace \
            -Dkotlin.compiler.execution.strategy=in-process \
            -PallowDebugSignedRelease=true \
            :app:assembleStandardDebug \
            :app:assembleStandardRelease 2>&1 | tee build.log

      - name: Show first errors
        if: failure()
        run: |
          grep -nE "^e: |error:|What went wrong|FAILED" -A6 build.log | head -120

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/standard/debug/*.apk dist/Nexify-debug.apk
          cp app/build/outputs/apk/standard/release/*.apk dist/Nexify-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Nexify-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
